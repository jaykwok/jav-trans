[project]
name = "jav-trans"
version = "1.5"
requires-python = ">3.14"
dependencies = [
    "accelerate",
    "fastapi",
    "huggingface-hub>=0.25",
    "httpx",
    "librosa",
    "numpy",
    "openai",
    # Pure-Python OpenCC port: forces translated output into the Chinese variant
    # the user picked. Pure Python matters because the release is a PyInstaller
    # bundle - the C extension build would need a toolchain on every machine.
    "opencc-python-reimplemented",
    "psutil",
    "python-dotenv",
    "python-multipart",
    "pywebview",
    "rich",
    "scipy",
    "soundfile",
    "torch>=2.13.0",
    # 0.16.0 is the first release carrying the FFmpeg 9 loaders
    # (`libtorchcodec_core9`). Unpinned, a fresh install resolves to whatever is
    # newest at the time and 0.15.0 enumerates majors 8 down to 4 only - paired
    # with the FFmpeg 9.x that `winget install Gyan.FFmpeg.Shared` now delivers,
    # nothing loads and no audio decodes. The floor is what keeps the bundled
    # DLLs and the installed wheel from drifting apart.
    "torchcodec>=0.16.0",
    "transformers>=5.13.0",
    "uvicorn[standard]",
    "xxhash",
]

[dependency-groups]
dev = [
    "pyinstaller",
    "pytest",
    "scikit-learn",
]

# torchaudio is deliberately absent, and cannot be added on this stack: neither
# the cu130 nor the cu132 index publishes a cp314 wheel for it (cu132 stops at
# torchaudio 2.2.0 / cp312). The cu128 index does have cp314 wheels, but they
# link against torch 2.9.x/cu128 and would either downgrade torch or mismatch
# the libtorch ABI. CTC forced alignment is therefore implemented in
# `src/asr/alignment.py` and verified against exhaustive path enumeration in
# `tests/test_asr_alignment_head.py`.

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = [
    "-p",
    "no:cacheprovider",
]

norecursedirs = [
    ".venv",
    ".pytest_cache",
    "__pycache__",
    "agents",
    "models",
    "video",
]
